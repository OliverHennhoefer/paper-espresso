name: Test

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  unit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - run: uv sync --locked
      - run: uv run --locked python -m unittest discover -s tests

  latex-integration:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - run: sudo apt-get update
      - run: sudo apt-get install --yes poppler-utils lmodern texlive-latex-base texlive-latex-recommended texlive-latex-extra
      - name: Run content-neutral pdflatex integration test
        env:
          PAPER_ESPRESSO_LATEX_INTEGRATION: "1"
        run: python3 -m unittest discover -s tests
