name: Test

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  unit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - run: uv sync --locked
      - run: uv run --locked python -m unittest discover -s tests

  canonical-example:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - run: sudo apt-get update
      - run: sudo apt-get install --yes poppler-utils texlive-latex-base texlive-latex-recommended texlive-latex-extra
      - name: Compile canonical digest through the isolated preflight boundary
        run: >-
          python3 skills/paper-espresso/scripts/compile_tex.py
          attention-is-all-you-need-espresso.tex
          --output-dir .
          --engine pdflatex
      - name: Validate canonical digest
        run: >-
          python3 skills/paper-espresso/scripts/validate_output.py
          attention-is-all-you-need-espresso.pdf
          --max-pages 1
          --tex attention-is-all-you-need-espresso.tex
          --log attention-is-all-you-need-espresso.log
